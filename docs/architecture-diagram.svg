<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="620" fill="#F5F6F8"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#14161A">Atomberg Care Connect — Architecture</text>

  <!-- Agent -->
  <rect x="40" y="100" width="220" height="110" rx="14" fill="#14161A"/>
  <text x="150" y="140" text-anchor="middle" fill="#FFC400" font-weight="700" font-size="15">Support Agent</text>
  <text x="150" y="165" text-anchor="middle" fill="#fff" font-size="12">Browser (React)</text>
  <text x="150" y="185" text-anchor="middle" fill="#C9CBD3" font-size="11">mic / cam / screen</text>

  <!-- Customer -->
  <rect x="40" y="400" width="220" height="110" rx="14" fill="#14161A"/>
  <text x="150" y="440" text-anchor="middle" fill="#FFC400" font-weight="700" font-size="15">Customer</text>
  <text x="150" y="465" text-anchor="middle" fill="#fff" font-size="12">Browser (React)</text>
  <text x="150" y="485" text-anchor="middle" fill="#C9CBD3" font-size="11">mic / cam, no app install</text>

  <!-- Server box -->
  <rect x="340" y="80" width="620" height="460" rx="16" fill="#FFFFFF" stroke="#E0E0E5" stroke-width="2"/>
  <text x="650" y="115" text-anchor="middle" font-size="16" font-weight="800" fill="#14161A">Atomberg Care Server (Node.js)</text>

  <!-- Socket.IO signaling -->
  <rect x="370" y="140" width="260" height="80" rx="12" fill="#FFF6D9" stroke="#FFC400"/>
  <text x="500" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#14161A">Socket.IO Signaling</text>
  <text x="500" y="188" text-anchor="middle" font-size="11" fill="#6B7280">join, mute state, chat,</text>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#6B7280">recording controls</text>

  <!-- mediasoup SFU -->
  <rect x="650" y="140" width="280" height="120" rx="12" fill="#EAF7EF" stroke="#1FAA59"/>
  <text x="790" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#14161A">mediasoup SFU</text>
  <text x="790" y="190" text-anchor="middle" font-size="11" fill="#6B7280">1 Router per session</text>
  <text x="790" y="208" text-anchor="middle" font-size="11" fill="#6B7280">Send/Recv WebRTC Transports</text>
  <text x="790" y="226" text-anchor="middle" font-size="11" fill="#6B7280">audio + video Producers/Consumers</text>
  <text x="790" y="244" text-anchor="middle" font-size="10" fill="#1FAA59">⇒ all media relayed (no P2P)</text>

  <!-- Express REST -->
  <rect x="370" y="260" width="260" height="80" rx="12" fill="#EAF1FB" stroke="#3B82F6"/>
  <text x="500" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#14161A">Express REST API</text>
  <text x="500" y="308" text-anchor="middle" font-size="11" fill="#6B7280">sessions, invites, history,</text>
  <text x="500" y="324" text-anchor="middle" font-size="11" fill="#6B7280">admin live view, /metrics</text>

  <!-- Recorder -->
  <rect x="650" y="290" width="280" height="80" rx="12" fill="#FDEDED" stroke="#E5484D"/>
  <text x="790" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#14161A">Recorder (PlainTransport)</text>
  <text x="790" y="338" text-anchor="middle" font-size="11" fill="#6B7280">RTP → ffmpeg → .webm</text>
  <text x="790" y="354" text-anchor="middle" font-size="11" fill="#6B7280">good-to-have, documented</text>

  <!-- DB -->
  <rect x="450" y="400" width="320" height="100" rx="12" fill="#F1F2F4" stroke="#9AA0AC"/>
  <text x="610" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#14161A">SQLite (sessions.db)</text>
  <text x="610" y="452" text-anchor="middle" font-size="11" fill="#6B7280">sessions · invites · participants</text>
  <text x="610" y="470" text-anchor="middle" font-size="11" fill="#6B7280">chat_messages · recordings · events</text>

  <!-- Admin -->
  <rect x="370" y="540" width="200" height="40" rx="10" fill="#F1F2F4" stroke="#9AA0AC"/>
  <text x="470" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#14161A">/admin — Ops Dashboard</text>

  <rect x="600" y="540" width="200" height="40" rx="10" fill="#F1F2F4" stroke="#9AA0AC"/>
  <text x="700" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#14161A">/history — QA &amp; Review</text>

  <!-- Connections -->
  <line x1="260" y1="155" x2="370" y2="180" stroke="#14161A" stroke-width="2"/>
  <line x1="260" y1="185" x2="650" y2="200" stroke="#1FAA59" stroke-width="2"/>
  <line x1="260" y1="455" x2="370" y2="300" stroke="#14161A" stroke-width="2"/>
  <line x1="260" y1="425" x2="650" y2="220" stroke="#1FAA59" stroke-width="2"/>

  <line x1="500" y1="220" x2="500" y2="260" stroke="#9AA0AC" stroke-width="2"/>
  <line x1="610" y1="340" x2="610" y2="400" stroke="#9AA0AC" stroke-width="2"/>
  <line x1="790" y1="260" x2="790" y2="290" stroke="#9AA0AC" stroke-width="2"/>
  <line x1="500" y1="340" x2="470" y2="540" stroke="#9AA0AC" stroke-width="2"/>
  <line x1="610" y1="500" x2="700" y2="540" stroke="#9AA0AC" stroke-width="2"/>

  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#9AA0AC">All WebRTC media (UDP/DTLS-SRTP) terminates at the server — clients never connect directly to each other.</text>
</svg>
